# nginx config for the dobrymaxx.ru landing (static Astro site in /var/www/dobrymaxx.ru).
#
# Kept in the repo for history. On the server this file lives at
#   /etc/nginx/sites-available/dobrymaxx.ru
# symlinked into /etc/nginx/sites-enabled/. It is NOT deployed by the GitHub
# Actions workflow (that only rsyncs the built dist/). Apply changes by hand:
#   1. sudo cp /etc/nginx/sites-available/dobrymaxx.ru "/etc/nginx/sites-available/dobrymaxx.ru.bak.$(date +%Y%m%d%H%M%S)"
#   2. copy this file over /etc/nginx/sites-available/dobrymaxx.ru
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
# Rollback: restore the .bak file and reload again.
#
# Shared server: this file only configures dobrymaxx.ru. The app.* / test-app.*
# subdomains have their own configs and their own HSTS - do not touch them here.
# Lines marked "managed by Certbot" are maintained by certbot; keep them.

server {
    server_name dobrymaxx.ru;
    root /var/www/dobrymaxx.ru;
    index index.html;

    # Do not reveal the nginx version (Server header, error pages).
    server_tokens off;

    # Security headers. "always" so they are sent on error responses (e.g. 404) too.
    # HSTS scoped to this host only (no includeSubDomains): subdomains manage their own.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    # CSP without nonce: inline scripts and styles are allowed, so pages are served
    # unchanged. Google Fonts (stylesheet + font files) are explicitly allowed.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'" always;

    location / { try_files $uri $uri/ =404; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dobrymaxx.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dobrymaxx.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = dobrymaxx.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name dobrymaxx.ru;

    # Do not reveal the nginx version on the HTTP redirect/404 responses either.
    server_tokens off;

    return 404; # managed by Certbot
}
