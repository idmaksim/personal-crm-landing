name: Deploy landing

# Push to main -> build dist/ in Actions -> rsync --delete to the server.
# Build happens only here, never on the server.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let a running deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 153.76.175.174
  DEPLOY_USER: crmapp
  DEPLOY_PATH: /var/www/dobrymaxx.ru

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
